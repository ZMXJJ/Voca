[project]
name = "voca-python-service"
version = "0.5.0"
description = "Local Python sidecar for the Voca desktop app."
requires-python = ">=3.11,<3.13"
# Ranges here are the cross-platform import-time baseline used by tooling
# (IDE indexing, `pip install -e .`, type checkers). The shipped, reproducible
# runtime pins live in requirements.runtime.txt and are layered with the
# platform files requirements.runtime.macos.txt / requirements.runtime.windows.txt.
# Keep this list in sync with the direct imports under app/ — a missing entry
# here means `pip install -e .` produces a service that cannot start.
dependencies = [
    "certifi>=2024.2.2",
    "einops>=0.8.0",
    "fastapi>=0.116.0",
    "huggingface-hub>=0.34.0",
    "inflect>=7.4.0",
    "kaldi-native-fbank>=1.20.0",
    "modelscope>=1.22.0",
    "numpy>=1.26.0",
    "pydantic>=2.11.0",
    "requests>=2.31.0",
    "safetensors>=0.4.3",
    "soundfile>=0.12.1",
    "tqdm>=4.66.0",
    "transformers>=4.40.0",
    "uvicorn>=0.35.0",
    "wetext>=0.1.0",
]
# Platform-only wheels are intentionally NOT declared here because the correct
# choice depends on the target (torch CPU/MPS vs the first-run CUDA overlay,
# and onnxruntime vs onnxruntime-gpu). See the requirements.runtime.*.txt files.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
